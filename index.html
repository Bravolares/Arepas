<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Arepas Interactivo</title>
    <!-- Enlace a los estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>AREPAS COLOMBIANAS</h1>
        <p>Calientitas • Recién Hechas • Bien Rellenas</p>
    </header>

    <main class="menu-grid">
        <!-- Tarjeta de Producto 1 -->
        <div class="tarjeta-producto">
            <img src="img/1.jpg" alt="Arepa de Prueba">
            <h3>Arepa con Queso</h3>
            <p class="precio">$4.500</p>
            
            <!-- Cuadro de selección de extras -->
            <div class="extras">
                <label>
                    <input type="checkbox" class="extra-item" data-precio="1000" value="Queso Extra"> 
                    + Queso Extra (+$1.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" data-precio="1500" value="Aguacate"> 
                    + Aguacate (+$1.500)
                </label>
            </div>

            <button class="btn-anadir" onclick="anadirAlCarrito('Arepa con Queso', 4500, this)">Añadir al Pedido</button>
        </div>

        <!-- Tarjeta de Producto 2 -->
        <div class="tarjeta-producto">
            <img src="img/1.jpg" alt="Arepa de Prueba">
            <h3>Arepa con Pollo</h3>
            <p class="precio">$5.000</p>
            
            <div class="extras">
                <label>
                    <input type="checkbox" class="extra-item" data-precio="1000" value="Queso Extra"> 
                    + Queso Extra (+$1.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" data-precio="15000" value="Quesochile"> 
                    + chile (+$15.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" data-precio="10000" value="pupis"> 
                    + pupis (+$10.000)
                </label>
            </div>

            <button class="btn-anadir" onclick="anadirAlCarrito('Arepa con Pollo', 5000, this)">Añadir al Pedido</button>
        </div>
    </main>

    <!-- Barra del Carrito y Envío -->
    <div class="carrito-flotante">
        <h3>🛒 Mi Pedido (<span id="contador-items">0</span>)</h3>
        <p>Total: <strong>$<span id="total-precio">0</span></strong></p>
        <!-- Ejecución directa a prueba de fallos de caché -->
        <button class="btn-enviar" onclick="
            if (carrito.length === 0) {
                alert('Tu carrito está vacío. Añade algunas arepas primero.');
            } else {
                var numeroTelefono = '573219163532';
                var textoComanda = '=========================\n   NUEVO PEDIDO DE AREPAS\n=========================\n\n';
                carrito.forEach((item, index) => {
                    textoComanda += (index + 1) + '. ' + item.nombre + ' ($' + item.precio.toLocaleString('es-CO') + ')\n';
                    if (item.extras.length > 0) { textoComanda += '   Extras: ' + item.extras.join(\', \') + '\n'; }
                    textoComanda += '-------------------------\n';
                });
                textoComanda += '\nTOTAL A PAGAR: $' + total.toLocaleString('es-CO') + '\n';
                window.open('https://wa.me' + numeroTelefono + '?text=' + encodeURIComponent(textoComanda), '_blank');
            }
        ">Enviar Pedido por WhatsApp</button>
    </div>

    <!-- Enlace a la lógica de JavaScript para la acumulación -->
    <script src="js/carrito.js"></script>
</body>
</html>
