<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Arepas Interactivo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>AREPAS COLOMBIANAS</h1>
        <p>Calientitas • Recién Hechas • Bien Rellenas</p>
    </header>

    <main class="menu-grid">
        <!-- AREPA CON QUESO -->
        <div class="tarjeta-producto">
            <img src="img/arepa-queso.jpg" alt="Arepa con Queso" onerror="this.src='https://unsplash.com'">
            <h3>Arepa con Queso</h3>
            <p class="precio">$4.500</p>
            
            <div class="extras">
                <label>
                    <input type="checkbox" class="extra-item" value="Queso Extra" data-precio="1000"> + Queso Extra (+$1.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" value="Aguacate" data-precio="1500"> + Aguacate (+$1.500)
                </label>
            </div>
            
            <button class="btn-anadir" onclick="anadirAlCarrito('Arepa con Queso', 4500, this)">Añadir al Pedido</button>
        </div>

        <!-- AREPA CON POLLO -->
        <div class="tarjeta-producto">
            <img src="img/arepa-pollo.jpg" alt="Arepa con Pollo" onerror="this.src='https://unsplash.com'">
            <h3>Arepa con Pollo</h3>
            <p class="precio">$5.000</p>
            
            <div class="extras">
                <label>
                    <input type="checkbox" class="extra-item" value="Queso Extra" data-precio="1000"> + Queso Extra (+$1.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" value="Chile" data-precio="15000"> + Chile (+$15.000)
                </label>
                <label>
                    <input type="checkbox" class="extra-item" value="Pupis" data-precio="10000"> + Pupis (+$10.000)
                </label>
            </div>
            
            <button class="btn-anadir" onclick="anadirAlCarrito('Arepa con Pollo', 5000, this)">Añadir al Pedido</button>
        </div>
    </main>

    <!-- CARRITO FLOTANTE -->
    <div class="carrito-flotante">
        <div class="info-carrito">
            <h3>🛒 Mi Pedido (<span id="contador-items">0</span>)</h3>
            <p>Total: <strong>$ <span id="total-precio">0</span></strong></p>
            
            <!-- Botón manual para capturar el GPS sin parpadeos -->
            <button id="btn-gps" class="btn-gps" onclick="obtenerUbicacion()">📍 Vincular mi GPS</button>
        </div>
        <button class="btn-enviar" onclick="enviarPedido()">Enviar Pedido por WhatsApp</button>
    </div>

    <script src="js/carrito.js"></script>
</body>
</html>
